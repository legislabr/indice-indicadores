# Ambiente de PRODUÇÃO/STAGING do painel.
# Não difere estruturalmente entre dev/staging/prod: tudo é controlado por .env.
# O painel fica atrás do Traefik (rede externa "web"), com HTTPS via Let's Encrypt.
#
#   cp .env.example .env   # e preencha PAINEL_HOST, PAINEL_SENHA_HASH, etc.
#   docker compose -f docker-compose-prod.yaml up -d --build
#
# Requer que a rede externa "web" já exista (criada pelo Traefik em legisla-deploy/).
services:
  painel:
    build:
      context: .
      dockerfile: painel/Dockerfile
    image: painel-legisla:prod
    container_name: painel-legisla
    environment:
      - DATA_DIR=/data
      - SCRIPT_PATH=/app/scripts/gera_csv.py
      - PAINEL_SECRET_KEY=${PAINEL_SECRET_KEY}
      - PAINEL_SENHA_HASH_B64=${PAINEL_SENHA_HASH_B64}
      - LEGISLATURA_ATUAL=${LEGISLATURA_ATUAL:-57}
    volumes:
      - ./data:/data
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # Roteamento por host nas duas portas (atende Cloudflare Flexible e Full)
      # HTTP (porta 80)
      - traefik.http.routers.painel-http.rule=Host(`${PAINEL_HOST:-painel-legisla.hacklab.com.br}`)
      - traefik.http.routers.painel-http.entrypoints=web
      - traefik.http.routers.painel-http.service=painel-svc
      # HTTPS (porta 443, cert self-signed default na origem)
      - traefik.http.routers.painel-https.rule=Host(`${PAINEL_HOST:-painel-legisla.hacklab.com.br}`)
      - traefik.http.routers.painel-https.entrypoints=websecure
      - traefik.http.routers.painel-https.tls=true
      - traefik.http.routers.painel-https.service=painel-svc
      # Porta interna do container
      - traefik.http.services.painel-svc.loadbalancer.server.port=8000
      # Rate-limit para mitigar força-bruta no login (aplicado a ambos os routers)
      - traefik.http.routers.painel-http.middlewares=painel-rl@docker
      - traefik.http.routers.painel-https.middlewares=painel-rl@docker
      - traefik.http.middlewares.painel-rl.ratelimit.average=5
      - traefik.http.middlewares.painel-rl.ratelimit.burst=10
      - traefik.http.middlewares.painel-rl.ratelimit.period=1m
    restart: unless-stopped

networks:
  web:
    external: true
